<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Portal de Documentos</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="google" content="notranslate">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main class="wrap">
  <header class="brand">
    <div class="logo">📁</div>
    <div><h1 id="titulo">Portal de Documentos</h1><p class="muted small">Envío seguro de documentos a tu contador</p></div>
  </header>

  <!-- Link inválido -->
  <section id="vError" class="card hidden">
    <h2>Link no válido</h2>
    <p class="muted">Este link está incompleto. Pide a tu contador tu link de acceso.</p>
  </section>

  <!-- PIN -->
  <section id="vPin" class="card hidden">
    <h2>Ingresa tu PIN</h2>
    <p class="muted">Es el PIN de 6 dígitos que te enviamos junto con este link.</p>
    <form id="fPin">
      <input id="pin" class="pin-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" placeholder="••••••" required>
      <button id="bPin" class="btn primary full">Entrar</button>
    </form>
    <p id="pinMsg" class="msg"></p>
  </section>

  <!-- Portal -->
  <section id="vApp" class="hidden">
    <div class="card row between">
      <div><p class="muted small">Empresa</p><h2 id="empNombre">—</h2></div>
      <button id="bSalir" class="btn ghost">Salir</button>
    </div>

    <div class="card">
      <label id="drop" class="drop">
        <input type="file" id="archivos" multiple accept="image/*,application/pdf,.pdf,.xml,.csv,.xls,.xlsx,.doc,.docx,.zip">
        <div class="drop-icon">⬆</div>
        <strong>Toca para elegir archivos o tomar foto</strong>
        <span class="muted small">o arrástralos aquí · PDF, fotos, XML, Excel, Word, ZIP · máx. <span id="maxMb"></span> MB c/u</span>
      </label>
      <div id="cola" class="cola"></div>
      <textarea id="nota" rows="2" maxlength="300" placeholder="Nota opcional (ej. estados de cuenta de octubre)"></textarea>
      <button id="bSubir" class="btn primary full" disabled>Enviar documentos</button>
      <p id="subMsg" class="msg"></p>
    </div>

    <div class="card">
      <h3>Documentos enviados</h3>
      <div id="lista" class="lista"><p class="muted small">Cargando…</p></div>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { firebaseConfig, DOMINIO_EMPRESAS, MAX_MB, NOMBRE_DESPACHO, ALMACENAMIENTO } from "./config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const st = ALMACENAMIENTO === "storage" ? getStorage(app) : null;

const $ = id => document.getElementById(id);
const show = v => ["vError","vPin","vApp"].forEach(x => $(x).classList.toggle("hidden", x !== v));
const msg = (id, t, cls = "") => { $(id).textContent = t; $(id).className = "msg " + cls; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tam = b => b < 1048576 ? (b/1024).toFixed(0) + " KB" : (b/1048576).toFixed(1) + " MB";
const ext = n => (n.split(".").pop() || "").toLowerCase().slice(0,4);
const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), x => x.toString(16).padStart(2,"0")).join("");

const TIPOS = { pdf:"application/pdf", xml:"text/xml", csv:"text/csv", xls:"application/vnd.ms-excel",
  xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", doc:"application/msword",
  docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document", zip:"application/zip",
  jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", heic:"image/heic", heif:"image/heif", webp:"image/webp" };
const PERMITIDO = /^(image\/.*|application\/pdf|text\/xml|application\/xml|text\/csv|application\/zip|application\/x-zip-compressed|application\/msword|application\/vnd\..*)$/;
const tipoDe = f => f.type || TIPOS[ext(f.name)] || "application/octet-stream";

document.title = NOMBRE_DESPACHO; $("titulo").textContent = NOMBRE_DESPACHO; $("maxMb").textContent = MAX_MB;

const empId = (new URLSearchParams(location.search).get("e") || "").trim().toLowerCase();
const correo = `${empId}@${DOMINIO_EMPRESAS}`;
let unsub = null, cola = [], sec = 0, subiendo = false;

if (!/^[a-z0-9]{8,32}$/.test(empId)) show("vError");
else {
  await setPersistence(auth, browserSessionPersistence); // la sesión se cierra al cerrar el navegador
  onAuthStateChanged(auth, async u => {
    if (u && u.email === correo) entrar();
    else { if (u) await signOut(auth); unsub?.(); show("vPin"); $("pin").focus(); }
  });
}

// ---------- PIN ----------
$("fPin").addEventListener("submit", async e => {
  e.preventDefault();
  $("bPin").disabled = true; msg("pinMsg", "Verificando…");
  try { await signInWithEmailAndPassword(auth, correo, $("pin").value.trim()); msg("pinMsg", ""); $("pin").value = ""; }
  catch (err) {
    msg("pinMsg", (err.code || "").includes("too-many-requests")
      ? "Demasiados intentos. Espera unos minutos e intenta de nuevo."
      : "PIN incorrecto. Verifica con tu contador.", "err");
  } finally { $("bPin").disabled = false; }
});
$("bSalir").onclick = () => signOut(auth);

// ---------- Portal ----------
async function entrar() {
  show("vApp");
  try {
    const s = await getDoc(doc(db, "empresas", empId));
    if (!s.exists() || s.data().activo !== true) return desactivada();
    $("empNombre").textContent = s.data().nombre;
    $("drop").classList.remove("off");
  } catch { return desactivada(); }

  unsub?.();
  unsub = onSnapshot(
    query(collection(db, "empresas", empId, "archivos"), orderBy("fecha", "desc"), limit(100)),
    snap => {
      $("lista").innerHTML = snap.empty ? '<p class="muted small">Aún no has enviado documentos.</p>' :
        snap.docs.map(d => {
          const a = d.data(), f = a.fecha?.toDate?.();
          return `<div class="item">
            <div class="ico">${esc(ext(a.nombre))}</div>
            <div class="info"><div class="nm">${esc(a.nombre)}</div>
              <div class="muted small">${f ? f.toLocaleString("es-MX",{dateStyle:"medium",timeStyle:"short"}) : "Enviando…"} · ${tam(a.tamano)}</div></div>
            <span class="tag ${a.revisado ? "ok" : "warn"}">${a.revisado ? "Revisado" : "Recibido"}</span>
          </div>`;
        }).join("");
    },
    () => { $("lista").innerHTML = '<p class="muted small">No se pudo cargar la lista.</p>'; }
  );
}
function desactivada() {
  $("empNombre").textContent = "Acceso desactivado";
  $("drop").classList.add("off"); $("bSubir").disabled = true;
  $("lista").innerHTML = '<p class="muted small">Este acceso está desactivado. Contacta a tu contador.</p>';
}

// ---------- Cola de archivos ----------
function agregar(files) {
  const rech = [];
  for (const f of files) {
    const comprimible = /^image\/(jpeg|png|webp)$/.test(f.type) && f.size <= 40 * 1048576;
    if (f.size > MAX_MB * 1048576 && !comprimible) { rech.push(`${f.name} (pesa más de ${MAX_MB} MB)`); continue; }
    if (!PERMITIDO.test(tipoDe(f))) { rech.push(`${f.name} (tipo no permitido)`); continue; }
    cola.push({ id: ++sec, file: f, pct: 0, estado: "listo" });
  }
  msg("subMsg", rech.length ? "No se agregaron: " + rech.join(", ") : "", rech.length ? "err" : "");
  pintarCola();
}
function pintarCola() {
  $("cola").innerHTML = cola.map(it => `
    <div class="item" id="q${it.id}">
      <div class="ico">${esc(ext(it.file.name))}</div>
      <div class="info"><div class="nm">${esc(it.file.name)}</div>
        <div class="muted small">${tam(it.file.size)}${it.estado === "error" ? ' · <span style="color:var(--err)">Error, reintenta</span>' : ""}</div>
        <div class="bar"><i style="width:${it.pct}%"></i></div></div>
      ${subiendo ? "" : `<button class="x" data-q="${it.id}" title="Quitar">×</button>`}
    </div>`).join("");
  $("bSubir").disabled = subiendo || !cola.length;
  $("bSubir").textContent = cola.length ? `Enviar ${cola.length} documento${cola.length > 1 ? "s" : ""}` : "Enviar documentos";
}
$("cola").onclick = e => { const id = +e.target.dataset.q; if (id) { cola = cola.filter(x => x.id !== id); pintarCola(); } };
$("archivos").onchange = e => { agregar(e.target.files); e.target.value = ""; };
const drop = $("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => agregar(e.dataTransfer.files));

// ---------- Subida ----------
const progreso = (it, pct) => { it.pct = pct; const b = document.querySelector(`#q${it.id} .bar i`); if (b) b.style.width = pct + "%"; };

// Reduce fotos grandes (máx. 2000 px, JPG) para ahorrar espacio
async function preparar(f) {
  const original = { blob: f, nombre: f.name, tipo: tipoDe(f) };
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return original;
  try {
    const img = await createImageBitmap(f);
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
    if (!blob || blob.size >= f.size) return original;
    return { blob, nombre: f.name.replace(/\.[^.]+$/, "") + ".jpg", tipo: "image/jpeg" };
  } catch { return original; }
}

async function subir(it, nota) {
  const p = await preparar(it.file);
  if (p.blob.size > MAX_MB * 1048576) throw new Error("Archivo muy grande");
  return ALMACENAMIENTO === "storage" ? subirStorage(it, nota, p) : subirFirestore(it, nota, p);
}

// Modo gratis: el archivo se guarda en partes dentro de Firestore
const PARTE = 600000;
const aB64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
async function subirFirestore(it, nota, p) {
  const bytes = new Uint8Array(await p.blob.arrayBuffer());
  const n = Math.max(1, Math.ceil(bytes.length / PARTE));
  const aRef = doc(collection(db, "empresas", empId, "archivos"));
  for (let i = 0; i < n; i++) {
    await setDoc(doc(aRef, "partes", String(i)), { d: aB64(bytes.subarray(i * PARTE, (i + 1) * PARTE)) });
    progreso(it, (i + 1) / n * 100);
  }
  await setDoc(aRef, {
    nombre: p.nombre.slice(0, 200), tipo: p.tipo, tamano: bytes.length, nota,
    fecha: serverTimestamp(), revisado: false, empresaId: empId, almacen: "fs", partes: n
  });
}

// Modo Blaze: Firebase Storage
async function subirStorage(it, nota, p) {
  const tipo = p.tipo;
  const limpio = p.nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w.\-]+/g, "_").slice(-80);
  const ruta = `empresas/${empId}/${Date.now()}_${rnd(3)}_${limpio}`;
  const task = uploadBytesResumable(ref(st, ruta), p.blob, { contentType: tipo });
  await new Promise((ok, mal) => task.on("state_changed", s => progreso(it, s.bytesTransferred / s.totalBytes * 100), mal, ok));
  const url = await getDownloadURL(task.snapshot.ref);
  await addDoc(collection(db, "empresas", empId, "archivos"), {
    nombre: p.nombre.slice(0, 200), ruta, url, tipo, tamano: p.blob.size, nota,
    fecha: serverTimestamp(), revisado: false, empresaId: empId, almacen: "st"
  });
}
$("bSubir").onclick = async () => {
  if (!cola.length) return;
  subiendo = true; pintarCola(); msg("subMsg", "Enviando…");
  const nota = $("nota").value.trim().slice(0, 300);
  let ok = 0, fallos = 0;
  for (const it of cola) {
    try { await subir(it, nota); it.estado = "ok"; ok++; }
    catch (e) { console.error(e); it.estado = "error"; it.pct = 0; fallos++; }
  }
  cola = cola.filter(x => x.estado !== "ok");
  subiendo = false; pintarCola();
  if (!fallos) { $("nota").value = ""; msg("subMsg", `✓ ${ok} documento${ok > 1 ? "s enviados" : " enviado"} correctamente.`, "ok"); }
  else msg("subMsg", `${ok} enviados, ${fallos} con error. Revisa tu conexión y vuelve a intentar.`, "err");
};
</script>
</body>
</html>
